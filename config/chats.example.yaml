# Чаты, по которым делается сводка.
# Скопируйте этот файл в config/chats.yaml и впишите свои идентификаторы.
#
# Чата нет в списке — сообщения всё равно копятся в базе, но ничего не публикуется.
# Автопубликация включается наличием поля time; без него чат только копится.
# Значение по умолчанию: min_messages 30.
#
# Узнать идентификатор чата: добавить бота в чат, написать боту в личку /status —
# чат появится в разделе «Без настроек» вместе со своим id.

default_chat: -1001234567890   # чат для /test, когда id не указан явно

chats:
  # Основной чат. Автопубликация: ежедневно в 09:00 МСК, порог 10 сообщений.
  -1001234567890:
    name: Сообщество            # своё название, видно в /status; необязательно
    prompt: default             # файл prompts/default.md
    min_messages: 10            # меньше сообщений за период — день пропускается
    time: "09:00"               # МСК; поля нет — автопубликация выключена
    mark:                       # отметка важных сообщений; необязательно
      reaction: "🔥"            # какой реакцией отмечать
      by: [123456789]           # чьи реакции считать метками (id пользователей)

  # Группа для отладки. time не задан — автопубликация выключена, работает только /test.
  -1009876543210:
    name: Тестовый чат
    prompt: default
    min_messages: 5
